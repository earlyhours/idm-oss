name: Checks
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install free build tools
        run: pacman -Syu --noconfirm git qt6-base qt6-declarative qt6-wayland qt6-svg python nodejs yt-dlp ffmpeg curl clamav chromium networkmanager libcanberra libnotify
      - uses: actions/checkout@v4
      - name: Build
        run: bin/build
      - name: Transfer engine
        run: bin/test
      - name: Desktop interface
        run: bin/test-ui
      - name: Native browser messaging
        run: bin/test-bridge
      - name: Browser extension
        run: node --test tests/browser_extension_test.mjs
      - name: Browser popup and capture interface
        run: node tests/browser_popup_ui_test.mjs
      - name: Browser registration
        run: python tests/install_browser_test.py
      - name: Queue and scheduling behavior
        run: bin/test-automation
      - name: Independent adversarial checks
        run: bin/test-automation-adversarial
      - name: Website mirroring
        run: python tests/website_worker_test.py
      - name: Trusted and untrusted HTTPS
        run: bin/test-tls
      - name: Media quality variants
        run: python tests/media_quality_test.py
      - name: Python module and standalone yt-dlp loading
        run: python tests/mediaworker_test.py
      - name: Update official antivirus definitions
        run: freshclam --stdout
      - name: Scanner and completion integration
        run: bin/test-system
      - name: Real browser capture
        run: node tests/browser_e2e.mjs
      - name: Progress and concurrency snapshots
        run: bin/test-features
      - name: Batch acceptance and automatic start
        run: bin/test-parity
      - name: Feature coverage ledger
        run: python tools/check_feature_coverage.py
      - name: Command line
        run: python tests/cli_test.py
      - name: Static tooling
        run: python -m py_compile tools/*.py tests/*.py src/mediaworker.py
