<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark"><title>IDM Native</title>
  <link rel="icon" href="icons/icon-32.png"><link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="brand">
    <img src="icons/mark.svg" width="28" height="28" alt=""><h1>IDM Native</h1>
    <div class="connection-card" aria-label="Desktop connection" data-state="checking" id="connection-card"><span class="connection-dot" aria-hidden="true"></span><strong id="connection-title" role="status" aria-live="polite">Checking</strong><button id="check" class="icon-button" type="button" aria-label="Check desktop connection" title="Check desktop connection"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v5m8-5v5M6 8h12v3a6 6 0 0 1-6 6v4m-6-10h12"/></svg></button></div>
  </header>
  <main>
    <p id="connection" class="connection-error" role="status" aria-live="polite"></p>
    <section class="capture" aria-labelledby="capture-title">
      <div class="section-heading"><h2 id="capture-title">Media <span id="source-count">0</span></h2><button id="rescan" class="icon-button" type="button" aria-label="Rescan page" title="Rescan page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3A7 7 0 0 0 18 17"/></svg></button></div>
      <label for="sources" class="visually-hidden">Detected sources</label><p id="source-help" class="visually-hidden">Select media, choose quality, then Download.</p>
      <div class="source-area"><select id="sources" size="3" aria-describedby="source-help"></select><div id="empty-sources" hidden><strong>No media found</strong><p>Play a video, then rescan.</p></div></div>
      <div id="download-controls">
        <div class="quality-row"><label for="quality">Quality</label><select id="quality"><option value="best">Best video + audio</option><option value="1080p">Up to 1080p</option><option value="720p">Up to 720p</option><option value="audio">Audio only</option></select></div>
        <button id="download" class="primary" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></svg> Download</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <section class="batch"><button id="all-links" class="text-button batch-button" type="button">Page links <span aria-hidden="true">→</span></button><p id="batch-summary"></p><button id="confirm-links" type="button" hidden>Download links</button></section>
    <details class="integration"><summary>Preferences</summary><div class="preferences">
      <fieldset><legend>Browser downloads</legend>
        <label class="check"><input id="intercept" type="checkbox"><span>Send downloads to IDM</span></label>
        <div id="handoff-options" hidden><label for="types">File types</label><input id="types" type="text" value="*" placeholder="* or zip,pdf,mp4" maxlength="300"><small>Failed handoffs stay in your browser.</small></div>
      </fieldset>
      <fieldset><legend>Video capture</legend>
        <label class="check"><input id="show-panel" type="checkbox" checked><span>Show button on pages</span></label>
        <div class="quality-row" id="panel-options"><label for="position">Position</label><select id="position"><option value="right">Bottom right</option><option value="left">Bottom left</option></select></div>
      </fieldset>
      <button id="save" type="button">Save</button><p id="settings-status" role="status" aria-live="polite"></p>
    </div></details>
  </main>
  <script src="popup.js"></script>
</body>
</html>
